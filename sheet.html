<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>popn_clear - 难度表</title>
    <link rel="stylesheet" href="./styles.css?v=20260819-3" />
  </head>
  <body class="sheet-page">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="popn_clear home">
          <span class="brand-mark">pc</span>
          <span>
            <strong>popn_clear</strong>
            <small>clear lamp sheet</small>
          </span>
        </a>

        <nav class="level-nav" aria-label="level">
          <button class="level-pill active" type="button" data-level="46">46</button>
          <button class="level-pill muted" type="button" data-level="47">47</button>
          <button class="level-pill muted" type="button" data-level="48">48</button>
          <button class="level-pill muted" type="button" data-level="49">49</button>
          <button class="level-pill muted" type="button" data-level="50">50</button>
          <a class="level-pill nav-link-pill sran-nav-pill muted" href="./srandom.html?table=1">Sran1</a>
          <a class="level-pill nav-link-pill sran-nav-pill muted" href="./srandom.html?table=2">Sran2</a>
          <a class="level-pill nav-link-pill sran-nav-pill muted" href="./srandom.html?table=3">Sran3</a>
          <a class="level-pill nav-link-pill sran-nav-pill muted" href="./srandom.html?table=4">Sran4</a>
          <a class="level-pill nav-link-pill sran-nav-pill muted" href="./srandom.html?table=5">Sran5</a>
        </nav>

        <div class="profile-actions">
          <div class="sync-actions" aria-label="record sync actions">
            <button class="sync-button" type="button" data-action="save-local" title="保存到浏览器缓存">
              <span>↥</span>
              上传至本地
            </button>
            <button class="sync-button" type="button" data-action="save-account" title="登录后同步到账号">
              <span>↥</span>
              上传至账号
            </button>
            <button class="sync-button" type="button" data-action="load-local" title="从浏览器缓存恢复">
              <span>↧</span>
              本地加载
            </button>
            <button class="sync-button" type="button" data-action="load-account" title="登录后读取账号记录">
              <span>↧</span>
              从账号加载
            </button>
          </div>
          <a class="icon-button room-button" href="./lounge.html" aria-label="进入交流室" title="交流室">🏠</a>
          <div class="profile-menu">
            <button class="profile-chip" id="profile-menu-toggle" type="button" aria-expanded="false" aria-haspopup="true">
              <span class="profile-dot"></span>
              <span id="profile-name">guest</span>
            </button>
            <div class="profile-dropdown" id="profile-dropdown" hidden>
              <button type="button" data-auth-action="login">
                <span class="menu-icon">in</span>
                <span>
                  <strong>登录</strong>
                  <small>邮箱和密码</small>
                </span>
              </button>
              <button type="button" data-auth-action="register">
                <span class="menu-icon">+</span>
                <span>
                  <strong>注册账号</strong>
                  <small>创建玩家 ID</small>
                </span>
              </button>
              <button type="button" data-auth-action="logout">
                <span class="menu-icon">out</span>
                <span>
                  <strong>退出登录</strong>
                  <small>回到 guest</small>
                </span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="main-grid">
        <aside class="side-panel">
          <div class="level-title">
            <span>Difficulty</span>
            <strong id="current-level">46</strong>
          </div>

          <div class="progress-box">
            <span id="clear-count">0 / 0</span>
            <div class="progress-track">
              <span id="clear-progress"></span>
            </div>
          </div>

          <button class="sort-button" id="sort-toggle" type="button" aria-pressed="false">
            <span>Sort</span>
            <strong id="sort-label">↑</strong>
          </button>

          <div class="group-list" id="group-list"></div>

          <section class="lamp-chart" aria-label="clear lamp chart">
            <div class="pie-chart" id="lamp-pie"></div>
            <div class="pie-legend" id="pie-legend"></div>
          </section>
        </aside>

        <section class="song-area" aria-label="song records">
          <div class="toolbar">
            <div class="toolbar-heading">
              <p class="eyebrow">pop'n music</p>
              <h1 id="page-title">Lv46 难度表</h1>
            </div>
            <div class="toolbar-actions-slot">
              <div class="toolbar-actions">
                <button class="batch-toggle" id="batch-toggle" type="button" aria-pressed="false" aria-controls="batch-panel">
                  <span aria-hidden="true">✓</span>
                  <strong>批量编辑</strong>
                </button>
                <label class="search-box">
                  <span>Search</span>
                  <input id="search" type="search" placeholder="Title / genre" />
                </label>
              </div>
            </div>

            <div id="song-list" class="song-sections"></div>
          </div>

          <section class="batch-panel" id="batch-panel" aria-label="批量编辑" hidden>
            <div class="batch-panel-summary">
              <span class="batch-panel-mark" aria-hidden="true">✓</span>
              <span>
                <strong id="batch-selection-count">已选 0 首</strong>
                <small id="batch-selection-hint">点击卡片，或按难度分组全选</small>
              </span>
            </div>

            <div class="batch-fields">
              <label>
                <span>clear</span>
                <select id="batch-clear-select"></select>
              </label>
              <label>
                <span>medal</span>
                <select id="batch-medal-select"></select>
              </label>
              <label class="batch-write-field">
                <span>应用范围</span>
                <select id="batch-write-mode">
                  <option value="blank">仅填未记录</option>
                  <option value="upgrade">只提升成绩</option>
                  <option value="all">覆盖所选记录</option>
                </select>
              </label>
            </div>

            <div class="batch-panel-actions">
              <button class="batch-secondary" id="batch-select-visible" type="button">全选当前结果</button>
              <button class="batch-secondary" id="batch-clear-selection" type="button" disabled>取消选择</button>
              <button class="batch-apply" id="batch-apply" type="button" disabled>应用到所选</button>
              <button class="batch-exit" id="batch-exit" type="button" aria-label="退出批量编辑">×</button>
            </div>

            <div class="batch-feedback" id="batch-feedback" aria-live="polite" hidden>
              <span id="batch-feedback-text"></span>
              <button id="batch-undo" type="button" hidden>撤销</button>
            </div>
          </section>
        </section>
      </main>
    </div>

    <template id="song-section-template">
      <section class="song-section">
        <div class="section-heading">
          <h2></h2>
          <span></span>
        </div>
        <div class="song-list"></div>
      </section>
    </template>

    <template id="song-card-template">
      <article class="song-card">
        <button class="card-select" type="button" aria-pressed="false" aria-label="选择歌曲">
          <span aria-hidden="true"></span>
        </button>
        <div class="song-main">
          <div class="song-content">
            <div class="song-head">
              <div>
                <p class="genre"></p>
                <h3 class="title"></h3>
              </div>
              <span class="danger-badge" hidden>辛ゲージ</span>
            </div>

            <dl class="meta-grid">
              <div>
                <dt>Notes</dt>
                <dd class="notes"></dd>
              </div>
              <div class="diff-cell">
                <dt>Diff.</dt>
                <dd class="difficulty"></dd>
              </div>
            </dl>
          </div>

          <div class="icon-rail">
            <span class="unrecorded-badge" hidden>未记录</span>
            <img class="medal-preview" alt="" hidden />
            <img class="score-preview" alt="" hidden />
          </div>
        </div>

        <div class="control-grid">
          <label>
            <span>clear</span>
            <select class="clear-select"></select>
          </label>
          <label>
            <span>medal</span>
            <select class="medal-select"></select>
          </label>
          <label>
            <span>score</span>
            <input class="score-input" type="number" inputmode="numeric" min="0" max="100000" placeholder="-" />
          </label>
          <label>
            <span>rank</span>
            <select class="score-rank-select"></select>
          </label>
        </div>
      </article>
    </template>

    <div class="modal-backdrop" id="auth-modal" hidden>
      <section class="modal-panel auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
        <button class="modal-close" type="button" data-modal-close="auth" aria-label="关闭">×</button>
        <p class="eyebrow">account</p>
        <h2 id="auth-modal-title">登录</h2>
        <p class="modal-copy" id="auth-modal-copy">登录后可以把本机点灯记录同步到账号。</p>
        <form id="auth-form">
          <label>
            <span>邮箱</span>
            <input id="auth-email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>密码</span>
            <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required />
          </label>
          <label id="auth-display-field">
            <span>玩家 ID</span>
            <input id="auth-display-name" type="text" autocomplete="nickname" minlength="1" maxlength="24" />
          </label>
          <div class="modal-actions">
            <button class="ghost-button" type="button" data-modal-close="auth">取消</button>
            <button class="modal-primary" id="auth-submit" type="submit">登录</button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="message-modal" hidden>
      <section class="modal-panel message-panel" role="dialog" aria-modal="true" aria-labelledby="message-modal-title">
        <button class="modal-close" type="button" data-modal-close="message" aria-label="关闭">×</button>
        <h2 id="message-modal-title">提示</h2>
        <p class="modal-copy" id="message-modal-copy"></p>
        <div class="modal-actions">
          <button class="ghost-button" id="message-cancel" type="button">取消</button>
          <button class="modal-primary" id="message-ok" type="button">确定</button>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./record-identity.js?v=20260815-1"></script>
    <script src="./app.js?v=20260819-1"></script>
  </body>
</html>
